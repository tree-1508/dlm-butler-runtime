name: CodeQL

on:
  push:
    branches: [dld-051-v15.30.0]
  pull_request:
    branches: [dld-051-v15.30.0]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4 pinned 2026-08-26
        with:
          languages: go
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          output: codeql-results
      - name: Upload CodeQL SARIF evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dld-051-codeql-sarif-${{ github.sha }}
          path: codeql-results/
          retention-days: 30
          if-no-files-found: error
